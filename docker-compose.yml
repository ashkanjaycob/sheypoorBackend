services:
  mysql:
    image: mysql:8.0
    container_name: sheypoor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sheypoor
      MYSQL_USER: sheypoor
      MYSQL_PASSWORD: sheypoor
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # اختیاری: رابط گرافیکی دیتابیس روی http://localhost:8080
  adminer:
    image: adminer
    container_name: sheypoor-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
